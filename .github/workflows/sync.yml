name: Sync Keiyoushi

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync.yml
      - scripts/sync_upstream.py
      - docs/upstream/sync-state.json

concurrency:
  group: tachivf-upstream-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.update.outputs.changed }}
      source_ref: ${{ steps.update.outputs.source_ref }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - name: Synchronize selected sources and shared dependencies
        run: python scripts/sync_upstream.py --apply
      - name: Commit upstream changes
        id: update
        run: |
          if git diff --quiet && test -z "$(git ls-files --others --exclude-standard)"; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Sync selected Keiyoushi sources and dependencies'
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo "source_ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  rebuild:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      source_ref: ${{ needs.sync.outputs.source_ref }}
    secrets: inherit

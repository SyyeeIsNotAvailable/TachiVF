name: Build TachiVF

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-provider: basic
      - name: Lint and compile the four extensions
        run: sh scripts/build.sh
      - name: Save development APKs and JARs
        uses: actions/upload-artifact@v7.0.2
        with:
          name: TachiVF-development
          retention-days: 14
          if-no-files-found: error
          path: |
            src/fr/*/build/outputs/apk/release/*.apk
            src/fr/*/build/outputs/jar/release/*.jar
            src/fr/*/build/keiyoushi-source-info.json
      - name: Save lint reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: TachiVF-lint
          retention-days: 14
          if-no-files-found: ignore
          path: |
            src/fr/*/build/reports/lint-results-release.*
            lib-multisrc/madara/build/reports/lint-results-release.*
